# Supply-chain protection (mirrors the root bunfig): refuse Bun-installed
# packages published within the last 3 days.
[install]
minimumReleaseAge = 259200

# Test isolation: force XDG_DATA_HOME to a throwaway temp dir for the whole test
# process so NO test can read or migrate the user's real shared cortexkit
# database (shared with OpenCode). See test-preload.ts for the rationale
# (2026-06-01 incident). Structural guard; do not remove.
[test]
preload = ["./test-preload.ts"]

# NOTE: per-test timeout is raised via `--timeout 120000` in package.json's
# "test" script, not here — Bun (as of 1.4.x) ignores a [test] timeout key in
# bunfig.toml; only the CLI flag is honored. The bump is for the shared
# self-hosted CI runner, where load spikes regularly push DB-heavy tests
# (migrations, memory-migration chains, dreamer leases) past Bun's 5s default.
